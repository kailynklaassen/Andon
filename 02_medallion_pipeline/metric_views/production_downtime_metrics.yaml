# Metric view: production_downtime_metrics   (Genie space: production)
# Deployed by 02_create_metric_views as {catalog}.{gold_schema}.production_downtime_metrics
# {catalog} / {gold_schema} are filled in from config/demo_config.yml.
version: 1.1
source: '{catalog}.{gold_schema}.fact_downtime_event'
comment: Downtime event KPIs (one row per MES downtime event) for KK's Parts. Use to count and rank stoppages by reason code, machine, line, plant, and shift.
dimensions:
- name: Event Date
  expr: event_date
  comment: Calendar date of the event.
  display_name: Event Date
  synonyms:
  - event day
  - date
- name: Event Month
  expr: event_month
  comment: First day of the calendar month of the event.
  display_name: Event Month
  synonyms:
  - month
- name: Fiscal Quarter
  expr: fiscal_quarter
  comment: 'KK''s Parts fiscal quarter, e.g. ''FY26 Q3''. Fiscal year starts Oct 1: Q1 Oct-Dec, Q2 Jan-Mar, Q3 Apr-Jun, Q4 Jul-Sep.'
  display_name: Fiscal Quarter
  synonyms:
  - quarter
  - fiscal period
  - FQ
- name: Shift
  expr: shift
  comment: 'Shift the event started in: A, B, C (night).'
  display_name: Shift
  synonyms:
  - crew
- name: Event Scope
  expr: event_scope
  comment: Machine = one work center down; Line = whole line stopped.
  display_name: Event Scope
  synonyms:
  - scope
- name: Plant ID
  expr: plant_id
  comment: 'Plant code: CLB Columbus, GVL Greenville, MTY Monterrey, WRO Wroclaw, PNQ Pune.'
  display_name: Plant ID
  synonyms:
  - site code
  - plant code
- name: Plant Name
  expr: plant_name
  comment: Plant name, e.g. 'Greenville Drivetrain Plant'.
  display_name: Plant Name
  synonyms:
  - plant
  - site
  - factory
  - facility
- name: Line ID
  expr: line_id
  comment: Production line code, e.g. GVL-L3.
  display_name: Line ID
  synonyms:
  - line code
- name: Line Name
  expr: line_name
  comment: Production line name, e.g. 'Gearbox Assembly'.
  display_name: Line Name
  synonyms:
  - line
  - production line
  - cell
- name: Machine ID
  expr: machine_id
  comment: Work center / machine code '<LINE>-WC<nn>', e.g. GVL-L3-WC01.
  display_name: Machine ID
  synonyms:
  - work center
  - asset
  - asset id
  - equipment id
- name: Machine Name
  expr: machine_name
  comment: 'Machine name, e.g. ''CNC Horizontal Machining Center #1''.'
  display_name: Machine Name
  synonyms:
  - machine
  - equipment
  - asset name
- name: Machine Type
  expr: machine_type
  comment: Machine type code, e.g. CNC_MACHINING_CENTER, CRIMP_PRESS.
  display_name: Machine Type
  synonyms:
  - equipment type
  - asset class
- name: Criticality
  expr: criticality
  comment: 'Asset criticality: A = bottleneck/no redundancy, B, C.'
  display_name: Criticality
  synonyms:
  - asset criticality
  - criticality class
- name: Reason Category
  expr: reason_category
  comment: 'MES downtime reason code: Equipment Failure, Planned Maintenance, Changeover, Material Shortage, Quality Hold, No Operator.'
  display_name: Reason Category
  synonyms:
  - downtime reason
  - reason code
  - stop reason
  - cause
- name: Reason Detail
  expr: reason_detail
  comment: 'Free-text detail: failure mode, material awaited, or changeover target.'
  display_name: Reason Detail
  synonyms:
  - failure mode
  - detail
- name: Is Unplanned
  expr: is_unplanned
  comment: True for unplanned stops (everything except Planned Maintenance and Changeover).
  display_name: Is Unplanned
  synonyms:
  - unplanned
measures:
- name: Downtime Events
  expr: COUNT(1)
  comment: Number of downtime events.
  display_name: Downtime Events
  synonyms:
  - stoppages
  - stops
  - events
- name: Downtime Hours
  expr: SUM(duration_hours)
  comment: Total event duration in hours.
  display_name: Downtime Hours
  synonyms:
  - lost hours
- name: Average Event Minutes
  expr: AVG(duration_minutes)
  comment: Average event duration in minutes.
  display_name: Average Event Minutes
  synonyms:
  - mean stop duration
- name: Unplanned Downtime Hours
  expr: SUM(duration_hours) FILTER (WHERE is_unplanned)
  comment: Hours of unplanned downtime.
  display_name: Unplanned Downtime Hours
  synonyms:
  - unplanned hours
- name: Equipment Failure Events
  expr: COUNT(1) FILTER (WHERE reason_category = 'Equipment Failure')
  comment: Number of breakdown events.
  display_name: Equipment Failure Events
  synonyms:
  - breakdowns
  - failures
- name: Material Shortage Events
  expr: COUNT(1) FILTER (WHERE reason_category = 'Material Shortage')
  comment: Number of line stops waiting on material.
  display_name: Material Shortage Events
  synonyms:
  - shortages
