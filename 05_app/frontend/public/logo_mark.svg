<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="KK's Parts">
  <!-- hex nut: the company's oldest product line, and a nod to "precision fasteners" -->
  <defs>
    <linearGradient id="kkNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16346B"/><stop offset="1" stop-color="#0A1F44"/>
    </linearGradient>
  </defs>
  <polygon points="60,4 108.5,32 108.5,88 60,116 11.5,88 11.5,32" fill="url(#kkNavy)"/>
  <polygon points="60,13 100.7,36.5 100.7,83.5 60,107 19.3,83.5 19.3,36.5" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>
  <!-- twin K monogram: two Ks sharing one stem, the second in red -->
  <g fill="#FFFFFF">
    <rect x="31" y="33" width="10" height="54" rx="1.5"/>
    <polygon points="41,60 62,33 74,33 52,60 74,87 62,87"/>
  </g>
  <polygon points="58,60 79,33 91,33 69,60 91,87 79,87" fill="#D62839"/>
  <!-- thread line -->
  <rect x="31" y="95" width="60" height="3" rx="1.5" fill="#D62839"/>
</svg>
