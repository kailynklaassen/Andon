      city: "Columbus"
      state_country: "OH, USA"
      region: "North America"
      lat: 39.9612
      lon: -82.9988
      product_family: "Hydraulic Components"
      pm_compliance_target: 0.97       # Columbus is the "well-run" benchmark plant
      lines:
        - { line_id: CLB-L1, name: "Valve Body Machining", process_flow: [CNC_MILL, CNC_MILL, DEBURR_CELL, WASH_STATION, CMM_INSPECTION] }
        - { line_id: CLB-L2, name: "Pump Assembly",        process_flow: [PRESS_FIT, ASSEMBLY_CELL, ASSEMBLY_CELL, TEST_STAND, PACKAGING] }
