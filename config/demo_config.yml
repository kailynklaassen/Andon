# =============================================================================
#  Manufacturing Agentic Framework Demo — the ONE file you edit
# =============================================================================
#  Every step in run/ reads this file (via config/config.py). Change a value here
#  and the data generator, pipeline, Genie spaces, supervisor agent, and app all
#  pick it up. Nothing downstream hardcodes a catalog, schema, or ID.
#
#  Sections:
#    workspace   -> where things land in Unity Catalog
#    data        -> size + time window of the synthetic data
#    company     -> the fictional manufacturer (plants, lines, warehouses)
#    story       -> the "planted" problems the agents should discover
#    genie       -> the four domain-focused Genie spaces
#    supervisor  -> the custom supervisor agent (Agent Bricks, code-first)
#    hitl        -> the app's human-in-the-loop loop: Lakebase ledger → lakehouse sync
# =============================================================================

workspace:
  catalog: your_catalog                # CHANGE ME — must already exist; you need USE/CREATE on it
  schemas:
    landing: mfg_landing              # UC Volumes holding raw files (the "source systems")
    bronze: mfg_bronze                # raw files ingested as-is (Auto Loader streaming tables)
    silver: mfg_silver                # cleaned, typed, conformed
    gold: mfg_gold                    # business-level materialized views + metric views
    app: mfg_app                      # Delta mirror of the app's human-in-the-loop ledger (Lakebase → lakehouse)
  volumes:
    raw: raw_data                     # /Volumes/<catalog>/<landing>/raw_data/<source_system>/<entity>/
    docs_prefix: genie_docs           # one volume PER Genie space: genie_docs_production, genie_docs_quality, ...
                                      # (Genie builds one document index per volume, so domains can't share one)
  warehouse_name: kkparts-demo        # the SQL warehouse Genie, the agent and the app run on (looked up by name)
  warehouse_id: ""                    # or pin an ID (wins over the name); both blank = first serverless warehouse

data:
  seed: 42                            # same seed -> same data -> documents stay accurate
  start_date: "2025-10-01"            # FY2026 window; the documents reference dates inside it
  end_date: "2026-09-30"
  telemetry_interval_minutes: 60      # 60 ≈ 1M sensor rows; 15 ≈ 4M rows
  sales_order_lines_per_day: 45

# -----------------------------------------------------------------------------
